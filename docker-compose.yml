# Native PG16 on this machine lacks pgvector, so the app DB runs here on 5433.
name: bebshax

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: bebshax-db
    environment:
      POSTGRES_USER: bebshax
      POSTGRES_PASSWORD: bebshax
      POSTGRES_DB: bebshax
    ports:
      - "5433:5432"
    volumes:
      - bebshax_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bebshax -d bebshax"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Demo/exhibition profile (docs/DEMO.md §7) ─────────────────────────────
  # NOT a production-hardening profile: it seeds well-known demo credentials
  # by default (BEBSHAX_DEMO_MODE). Config refuses demo_mode in
  # production/staging environments.
  # docker compose --profile full up --build -d
  # Plain `docker compose up -d db` / scripts/dev.js are unaffected.
  app:
    build:
      # Repo-root context so the image can COPY the repo-level providers.toml.
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: bebshax-app
    profiles: ["full"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Migrate, then serve. The in-process drift guard (bebshax/main.py) only
    # runs for localhost dev URLs with demo_mode off, so inside compose the
    # schema would otherwise never be checked. alembic.ini + alembic/ ship in
    # the image at /app (see apps/backend/Dockerfile); `exec` keeps uvicorn
    # as PID 1 so `docker compose stop` delivers SIGTERM to it, not to sh.
    command: >-
      sh -c "python -m alembic upgrade head
      && exec python -m uvicorn bebshax.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      # python:3.12-slim ships no curl/wget — use the stdlib instead.
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      # Migrations + demo seed run before the port opens.
      start_period: 60s
    env_file:
      # Passes BEBSHAX_* through from the repo-root .env (JWT secret etc.).
      - path: .env
        required: false
    environment:
      # Inside the compose network the db is db:5432, not localhost:5433.
      # Compose-local dev credentials — not secrets (same values as `db` above).
      BEBSHAX_DATABASE_URL: postgresql+asyncpg://bebshax:bebshax@db:5432/bebshax
      BEBSHAX_DEMO_MODE: ${BEBSHAX_DEMO_MODE:-true}
      # nginx (web service) fronts the API and sets X-Forwarded-For — without
      # this every client shares the proxy's IP for rate limiting.
      BEBSHAX_RATE_LIMIT_TRUST_FORWARDED_FOR: "true"
      # The local/emergency Ollama pools live on the host machine.
      OLLAMA_API_BASE: http://host.docker.internal:11434
    volumes:
      # Uploads/processed datasets must survive container rebuilds
      # (BEBSHAX_DATA_DIR=/app/data is baked into the image).
      - bebshax_appdata:/app/data
      # .dockerignore deliberately excludes data/ from the build context, so
      # without these read-only bind mounts the EvidenceStore is EMPTY inside
      # the container (no grounding evidence, quality_gate: null). Populate
      # the host side first: scripts/setup_datasets.py --profile minimal.
      # Nested under the named volume above — Docker mounts deeper paths last.
      - ./data/processed:/app/data/processed:ro
      - ./data/metadata:/app/data/metadata:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        # Empty default keeps federated sign-in disabled unless the operator
        # provides a tenant URL at build time.
        VITE_NEON_AUTH_URL: "${VITE_NEON_AUTH_URL:-}"
    container_name: bebshax-web
    profiles: ["full"]
    restart: unless-stopped
    depends_on:
      app:
        # nginx would otherwise start proxying to a backend still migrating.
        condition: service_healthy
    healthcheck:
      # busybox wget is present in nginx:alpine; --spider = HEAD, no body.
      # 127.0.0.1, not localhost: busybox resolves localhost to ::1 first and
      # the container sat "unhealthy" forever (observed 2026-09-08).
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    ports:
      - "8080:80"

volumes:
  bebshax_pgdata:
  bebshax_appdata:
