# BebshaX production profile — serves the built SPA and proxies /api to the
# backend container (docs/DEMO.md §7). Same-origin proxy means no CORS setup.
server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Backend accepts 25MB dataset uploads; nginx's 1MB default would 413
        # them at the proxy. 26m leaves headroom for multipart framing.
        client_max_body_size 26m;
        # LLM turns on free tiers run 30-120s+ — don't cut them off.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # SSE interview streaming needs unbuffered pass-through.
        proxy_buffering off;
        proxy_http_version 1.1;
    }

    location / {
        try_files $uri /index.html;  # SPA fallback

        # Security headers (2026-09-06). `always` also covers the 404→index
        # fallback response. Not set on /api/ — the backend owns those.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        # CSP verified against apps/frontend/dist (2026-09-06): scripts are
        # bundled ('self'); React sets styles via inline style attributes
        # ('unsafe-inline' required); fonts are self-hosted @fontsource files,
        # with small unicode-range subsets inlined as data: URIs by Vite; the
        # favicon is a data: SVG; the only network target is the same-origin
        # /api proxy (fetch + SSE). If the web image is built with
        # VITE_NEON_AUTH_URL set, federated sign-in fetches that tenant —
        # append its origin to connect-src (and Google avatar hosts to img-src).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }
}
