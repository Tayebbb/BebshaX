worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format request_summary '$request_id $request_method $status $bytes_sent $request_time';
    access_log /dev/stdout request_summary;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 30s;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied off;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        listen [::]:8080;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 26m;
        add_header_inherit merge;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "__BEBSHAX_CSP__" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ready\n";
        }

        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;
            try_files $uri =404;
        }

        location /api/ {
            gzip off;
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 315s;
            proxy_send_timeout 30s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            add_header Cache-Control "no-store" always;
        }

        location / {
            try_files $uri /index.html;
            add_header Cache-Control "no-cache" always;
        }
    }
}
