# BebshaX production profile — serves the built SPA and proxies /api to the
# backend container (docs/DEMO.md §7). Same-origin proxy means no CORS setup.
server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;
    index index.html;

    # Text assets ship uncompressed by default in nginx; the entry JS bundle is
    # ~204 KB raw vs ~49 KB gzipped, so this is the single largest transfer win
    # in the production profile. Fonts (woff2) and images are already
    # compressed — listing them would only burn CPU.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    # Static assets only. Compressing proxied /api/ JSON would put a
    # secret-bearing, attacker-influenced response under compression (BREACH),
    # and the win here comes from the entry bundle, not the API.
    gzip_proxied off;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Vite content-hashes every file under /assets/, so they are immutable:
    # a changed file gets a new URL. index.html must never be cached this way
    # or clients would keep loading the previous build's asset graph.
    location /assets/ {
        # `expires` would emit its own Cache-Control on top of this one, and
        # duplicated directives are handled inconsistently by CDNs.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Backend accepts 25MB dataset uploads; nginx's 1MB default would 413
        # them at the proxy. 26m leaves headroom for multipart framing.
        client_max_body_size 26m;
        # LLM turns on free tiers run 30-120s+ — don't cut them off.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # SSE interview streaming needs unbuffered pass-through.
        proxy_buffering off;
        proxy_http_version 1.1;
    }

    location / {
        try_files $uri /index.html;  # SPA fallback

        # The HTML entry point names the hashed asset bundle, so it must be
        # revalidated on every load or a deploy would strand clients on a
        # stale asset graph.
        add_header Cache-Control "no-cache" always;

        # Security headers (2026-09-06). `always` also covers the 404→index
        # fallback response. Not set on /api/ — the backend owns those.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        # CSP verified against apps/frontend/dist (2026-09-06, re-verified after
        # the perf pass): scripts are bundled ('self'); React sets styles via
        # inline style attributes ('unsafe-inline' required); fonts are
        # self-hosted @fontsource files emitted as separate .woff2 assets
        # (`assetsInlineLimit: 0` — they are no longer inlined as data: URIs,
        # but the favicon still is, hence `data:` on img-src); the only network
        # target is the same-origin /api proxy (fetch + SSE). If the web image
        # is built with VITE_NEON_AUTH_URL set, federated sign-in fetches that
        # tenant — append its origin to connect-src (and Google avatar hosts to
        # img-src).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }
}
