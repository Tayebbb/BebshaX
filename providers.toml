# Kilo override: the packaged catalog routes through "openrouter/free" and
# "kilo-auto/free" — aggregator-on-aggregator (two queues stacked), and carries
# nemotron-3-super-120b which measured 185s/turn live (2026-08-26). Keep only
# direct, fast targets.
[[provider]]
id = "kilo"
label = "Kilo Gateway (keyless)"
adapter = "openai"
base_url = "https://api.kilo.ai/api/gateway"
auth = "none"

[[provider.models]]
name = "stepfun/step-3.7-flash:free"
context = 262144
supports_json = false
rpd = 0
enabled = true

[[provider.models]]
name = "poolside/laguna-xs.2:free"
rpd = 0
enabled = false

# Independent OpenRouter dispatch belongs exclusively to OpenRouterAdapter.
[[provider]]
id = "openrouter"
label = "OpenRouter"
adapter = "openai"
base_url = "https://openrouter.ai/api/v1"
key_env = "OPENROUTER_API_KEY"
