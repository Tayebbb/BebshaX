# Application-owned overrides; the guarded adapter loads this explicit path.
# Legacy FREELLMPOOL_CONFIG, plugins and home-directory settings are not merged.
# Unknown context windows remain ineligible until verified limits are supplied.
#
# Providers redefined here REPLACE the packaged entry of the same id (models
# included). Context values are conservative floors of the published limits
# (2026-09): they gate pre-flight eligibility only and never truncate anything.
# supports_json marks endpoints verified to honor response_format=json_object.

# Pollinations — keyless OpenAI-compatible gateway (published 128k contexts).
[[provider]]
id = "pollinations"
label = "Pollinations (keyless)"
adapter = "openai"
base_url = "https://text.pollinations.ai/openai"
auth = "none"

[[provider.models]]
name = "openai"
context = 65536
supports_json = true
rpd = 0
enabled = true

[[provider.models]]
name = "openai-fast"
context = 65536
supports_json = true
rpd = 0
enabled = true

[[provider.models]]
name = "mistral"
context = 32768
rpd = 0
enabled = true

