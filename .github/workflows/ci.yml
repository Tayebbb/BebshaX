name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # B4 fail-fast requires a secret at import; CI-only value, ≥32 chars.
      BEBSHAX_JWT_SECRET: ci-only-jwt-secret-never-production-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: pip install -e ml_persona -e "apps/backend[dev]"
      - name: Lint (bug-tier rules — syntax errors, undefined names)
        run: python -m ruff check --config apps/backend/pyproject.toml apps/backend/bebshax apps/backend/tests ml_persona/src ml_persona/tests
      - name: Unit tests (no network) + coverage floor
        run: python -m pytest apps/backend/tests -q --cov=bebshax --cov-fail-under=68
      - name: Isolated ML persona tests
        run: python -m pytest ml_persona/tests -q
      - name: Dependency vulnerability scan (pip-audit)
        # Advisory for now: local baseline on 2026-09-06 was 0 known
        # vulnerabilities (pip-audit 2.10.1; the editable `bebshax` package is
        # skipped as not-on-PyPI, which is expected). Flip to blocking (drop
        # continue-on-error) after this step has passed green in CI once — CI
        # resolves fresh versions on Ubuntu, so the baseline must be confirmed
        # here, not only on a dev machine.
        continue-on-error: true
        run: python -m pip_audit --progress-spinner off --desc off

  typecheck:
    # Advisory until the pre-existing type debt is burned down (audit M11) —
    # failures are surfaced in the job log but do not block the merge yet.
    # Debt tracker: 79 errors / 0 warnings on 2026-09-06 (pyright 1.1.413,
    # typeCheckingMode basic). Update this number when it moves; make the job
    # blocking once it reaches 0.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend + pyright
        run: |
          pip install -e ml_persona -e "apps/backend[dev]"
          pip install pyright
      - name: Pyright
        run: pyright --pythonpath "$(which python)" apps/backend/bebshax

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — leaked-then-deleted secrets still count
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  migration-drift:
    # H6 guard: the migration chain must apply cleanly from zero and the
    # running head must equal the script head.
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bebshax
          POSTGRES_PASSWORD: bebshax
          POSTGRES_DB: bebshax
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bebshax" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      BEBSHAX_DATABASE_URL: postgresql+asyncpg://bebshax:bebshax@localhost:5432/bebshax
      BEBSHAX_JWT_SECRET: ci-only-jwt-secret-never-production-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: pip install -e ml_persona -e "apps/backend[dev]"
      - name: Apply all migrations from zero
        working-directory: apps/backend
        run: python -m alembic upgrade head
      - name: Verify current == heads (and exactly one head)
        working-directory: apps/backend
        run: |
          # Two heads means an unmerged branch of the migration chain —
          # `alembic upgrade head` refuses to run and every deploy breaks.
          head_count=$(python -m alembic heads | grep -cE '^[0-9a-f]+')
          echo "head_count=$head_count"
          test "$head_count" = "1"
          current=$(python -m alembic current | grep -oE '^[0-9a-f]+' | head -1)
          head=$(python -m alembic heads | grep -oE '^[0-9a-f]+' | head -1)
          echo "current=$current head=$head"
          test -n "$current" && test "$current" = "$head"
      - name: DB integration tests (pgvector round-trip)
        working-directory: apps/backend
        run: python -m pytest tests/memory/test_pg_integration.py -q -m integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches deploy/web.Dockerfile (node:24.11-alpine) — one Node major
          # for CI and the shipped image.
          node-version: "24"
      # M11: no --if-present — a vanished script must FAIL, not silently pass.
      - name: Install
        working-directory: apps/frontend
        run: npm ci
      - name: Build
        working-directory: apps/frontend
        run: npm run build
      - name: Theme-token drift gate
        working-directory: apps/frontend
        run: npm run theme:check
      - name: Tests
        working-directory: apps/frontend
        run: npm test -- --run

  compose-config:
    # The demo/exhibition profile is only exercised by hand before the venue;
    # at least keep both compose graphs parseable on every push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose (default + full profile)
        run: |
          docker compose config --quiet
          docker compose --profile full config --quiet
