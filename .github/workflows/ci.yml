name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: pip install -e "apps/backend[dev]"
      - name: Unit tests (no network)
        run: python -m pytest apps/backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Frontend build + tests (skips until apps/frontend exists)
        run: |
          if [ -f apps/frontend/package.json ]; then
            cd apps/frontend
            npm ci
            npm run build --if-present
            npm test --if-present -- --run
          else
            echo "apps/frontend not created yet (Phase 12) — skipping"
          fi
