name: Release Image Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/backend/Dockerfile
            uid: "10001:10001"
          - name: web
            dockerfile: deploy/web.Dockerfile
            uid: "101:101"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build only, never publish or start the stack
        run: docker build --platform linux/amd64 -f ${{ matrix.dockerfile }} -t bebshax-${{ matrix.name }}:ci .
      - name: Verify non-root image configuration
        run: test "$(docker image inspect --format '{{.Config.User}}' bebshax-${{ matrix.name }}:ci)" = "${{ matrix.uid }}"
      - name: Validate nginx under its restricted runtime UID
        if: matrix.name == 'web'
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges:true --memory 128m --cpus 0.5 --pids-limit 64
          --tmpfs /tmp:rw,noexec,nosuid,size=32m,uid=101,gid=101,mode=0700
          --add-host app:127.0.0.1 bebshax-web:ci -t
      - name: Validate API UID, writable storage and frozen numerical runtime
        if: matrix.name == 'api'
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges:true --memory 512m --cpus 1 --pids-limit 64
          --tmpfs /tmp:rw,noexec,nosuid,size=32m,uid=10001,gid=10001,mode=0700
          --tmpfs /app/data:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=0700
          --entrypoint python bebshax-api:ci /app/deploy/runtime_probe.py
      - name: Image SBOM
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: bebshax-${{ matrix.name }}:ci
          format: cyclonedx
          output: ${{ matrix.name }}.cdx.json
          github-pat: ${{ secrets.GITHUB_TOKEN }}
      - name: Block known fixable high and critical image vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: bebshax-${{ matrix.name }}:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          # Debian ships no fix for several flagged base packages; only CVEs with an
          # available fix can block a release. The SBOM above still records them all.
          ignore-unfixed: true
          github-pat: ${{ secrets.GITHUB_TOKEN }}
      - name: Retain the image dependency inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.name }}-sbom
          path: ${{ matrix.name }}.cdx.json
          if-no-files-found: error
          retention-days: 14
