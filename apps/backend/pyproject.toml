[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bebshax"
version = "0.1.0"
description = "BebshaX — evidence-grounded synthetic-persona research over aggregated free LLM capacity"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "freellmpool>=0.11.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.0",
    "huggingface_hub>=0.28.0,<1.0.0",
    "fastparquet>=2026.5.0",
    "slowapi>=0.1.9",
    "stripe>=12.0.0",
    # Imported directly by the backend (adapters, embeddings, world-bank, config)
    # but previously only reached the venv transitively — R8 review in
    # docs/SETUP.md § Dependency review (2026-09-06).
    "httpx>=0.27",
    "python-dotenv>=1.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.6",
    "pip-audit==2.10.1",
    "pyright==1.1.412",
    "PyYAML==6.0.3",
    "setuptools==84.0.0",
    "wheel==0.48.0",
]

[tool.setuptools.packages.find]
include = ["bebshax*"]

[tool.ruff.lint]
# Bug tier only (M11): syntax errors + undefined names. Style rules can be
# widened later without churning every teammate's open branch.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# tests/datasets/** imports `scripts.*`, which lives at the repo root. Without
# this, the suite collects from the repo root but dies with
# "ModuleNotFoundError: No module named 'scripts'" when run from apps/backend —
# so results depended on your working directory (the H6 failure mode again).
pythonpath = ["../.."]
addopts = "-m 'not integration'"
markers = [
    "integration: requires network or a live database",
]
# L14: deprecations are errors, so a dependency upgrade breaks the suite loudly
# instead of silently at runtime. Every exemption below is third-party and
# unfixable from here; each states what removes it. Do NOT add a blanket ignore —
# add a narrow message match with a reason, or fix the call site.
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    # starlette's TestClient warns on import; it subclasses UserWarning, not
    # DeprecationWarning, so it needs its own escalation line.
    "error::starlette.exceptions.StarletteDeprecationWarning",

    # starlette >=1.6 wants httpx2 for TestClient. Swapping httpx -> httpx2 is a
    # dependency change and needs an R8 review first. REMOVE WITH: httpx2 review + swap.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",

    # Starlette 1.6.0 uses AnyIO's deprecated BlockingPortal alias.
    # Remove when Starlette imports anyio.from_thread.BlockingPortal.
    'ignore:^The anyio\.abc\.BlockingPortal alias is deprecated, use anyio\.from_thread\.BlockingPortal instead\.$:DeprecationWarning',

    # slowapi 0.1.9 calls asyncio.iscoroutinefunction (removed in Python 3.16).
    # Upstream fix required. REMOVE WITH: slowapi release that uses inspect.iscoroutinefunction.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",

    # fastparquet 2026.5.0 uses the bare-integer numpy timedelta unit at import
    # (converted_types.py and writer.py). REMOVE WITH: fastparquet release fixing it.
    "ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning",
]
