[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bebshax"
version = "0.1.0"
description = "BebshaX — evidence-grounded synthetic-persona research over aggregated free LLM capacity"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "freellmpool>=0.11.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.0",
    "huggingface_hub>=0.28.0,<1.0.0",
    "fastparquet>=2026.5.0",
    "slowapi>=0.1.9",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "aiosqlite>=0.20.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["bebshax*"]

[tool.ruff.lint]
# Bug tier only (M11): syntax errors + undefined names. Style rules can be
# widened later without churning every teammate's open branch.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires network or a live database",
]
